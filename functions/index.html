<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Function</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }
      body{
                background-color: #000000;
      }
      .main-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100vh;
      }
      .wrapper {
        width: 400px;
        height: 500px;
        background-color: rgb(224, 231, 206);
        border: none;
        border-radius: 40px;
        background-color: #212121;
        padding: 40px;
      }
      h1 {
        color: #fff5cd;
        text-align: center;
        margin-bottom: 20px;
      }
      h2 {
        color: #fff5cd;
        text-align: center;
        margin-top: 70px;
      }
      h3{
        color: #5389c7;
         display:  inline;
         margin-top: 20px;
      }
      span{
        color: #5389c7;
        margin-top: 20px;
      }
      input {
        width: 100%;
        padding: 10px 20px 10px 20px;
        border: none;
        border-radius: 5px;
        margin-top: 50px;
      }
      button {
        width: 100%;
        padding: 10px 20px 10px 20px;
        border: none;
        border-radius: 5px;
        margin-top: 20px;
        background-color: #5389c7;
        color: #fff5cd;
        font-size: larger;
      }
      a{
        text-decoration: none;
        text-align: center;
        display: flex;
        justify-content: center;
        padding: 20px;
        color: #5389c7;
        cursor: pointer;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <div class="wrapper">
        <h1>G/N Game</h1>
        <span>Limit : <h3 id="limitPara">0</h3></span>
        <input type="number" id="input" placeholder="Enter a random number!" />
        <button onclick="guessGame()">check</button>
        <h2 id="para"></h2>
      </div>
    </div>
     <a href="https://github.com/Faizanriaz44553" target="_blank">Faizan Riaz</a>
    <script src="./app.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
