<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Todo-App</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/style/login.css">
  </head>
  <body>
    <main class="page-container">
      <div class="signin-card">
        
        <!-- Left Side: Login Form -->
        <div class="form-wrapper">
          <h1 class="form-title">Sign In</h1>

          <form class="signin-form" id="login-form">
            
            <!-- Email Input -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                </svg>
              </span>
              <input
                type="email"
                id="login-email"
                class="form-control"
                placeholder="Enter Email"
                required
              />
            </div>

            <!-- Password Input -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </span>
              <input
                type="password"
                id="login-password"
                class="form-control"
                placeholder="Enter Password"
                required
              />
            </div>

            <!-- Remember Me Checkbox -->
            <div class="checkbox-group">
              <input type="checkbox" id="remember-me" name="remember" />
              <label for="remember-me">Remember Me</label>
            </div>

            <!-- Submit Button -->
            <button type="button" id="login-btn" class="btn-register">Login</button>

            <!-- Sign Up Footer Link -->
            <p class="signup-redirect-text">
              Don’t have an account? <a href="../index.html" class="signin-link">Create One</a>
            </p>

          </form>
        </div>

        <!-- Right Side: Illustration -->
        <div class="illustration-wrapper">
          <img src="../assets/R 2@2x.png" alt="Sign in illustration" class="illustration-img" />
        </div>

      </div>
    </main>

    <!-- App Logic -->
     <script type="module" src="/firebase.js"></script>
    <script type="module" src="../js/login.js"></script>
  </body>
</html>
