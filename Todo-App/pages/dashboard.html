<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Todo-App</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style/dashboard.css" />
    <link rel="stylesheet" href="../style/navbar.css" />
  </head>
  <body>
    <!-- Top Navbar -->
    <nav
      class="navbar navbar-expand bg-white top-nav border-bottom px-3 px-md-4"
    >
      <div
        class="container-fluid p-0 d-flex align-items-center justify-content-between"
      >
        <div class="d-flex align-items-center gap-2">
          <button
            class="hamburger-btn d-lg-none"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#sidebarOffcanvas"
            aria-controls="sidebarOffcanvas"
            aria-label="Open Sidebar"
          >
            <i class="bi bi-list"></i>
          </button>

          <a class="navbar-brand brand-logo m-0" href="#">
            <span class="logo-red">Dash</span
            ><span class="logo-black">board</span>
          </a>
        </div>

        <!-- Center: Search Bar -->
        <div class="search-box d-none d-sm-flex">
          <input
            type="text"
            class="form-control"
            placeholder="Search your task here..."
          />
          <button class="search-btn" aria-label="Search">
            <i class="bi bi-search"></i>
          </button>
        </div>

        <!-- Right: Badges & Icons -->
        <div class="d-flex align-items-center gap-2">
          <button class="nav-icon-btn" aria-label="Notifications">
            <i class="bi bi-bell"></i>
          </button>
          <button
            type="button"
            class="btn-add-task-main"
            data-bs-toggle="modal"
            data-bs-target="#addTaskModal"
            aria-label="Add Task"
          >
            <i class="bi bi-plus-lg"></i>
            <span class="d-none d-sm-inline">Add Task</span>
          </button>
          <div
            class="date-badge ms-2 text-end d-none d-sm-block"
            id="nav-date"
          ></div>
        </div>
      </div>
    </nav>

    <div class="layout-container">
      <!-- Native Bootstrap Responsive Offcanvas Sidebar -->
      <aside
        class="offcanvas-lg offcanvas-start sidebar"
        tabindex="-1"
        id="sidebarOffcanvas"
        aria-labelledby="sidebarOffcanvasLabel"
      >
        <!-- Mobile Close Button (Bootstrap Native Dismiss) -->
        <div class="offcanvas-header justify-content-end d-lg-none p-3 pb-0">
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="offcanvas"
            data-bs-target="#sidebarOffcanvas"
            aria-label="Close"
          ></button>
        </div>

        <div class="offcanvas-body d-flex flex-column h-100 p-0">
          <div class="profile-section" id="navbar-profile">
            <div class="spinner-border text-light" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>

          <nav class="sidebar-nav">
            <a href="#" class="nav-link active">
              <span class="nav-icon"><i class="bi bi-grid-fill"></i></span>
              Dashboard
            </a>
            <a href="./vital.html" class="nav-link">
              <span class="nav-icon"
                ><i class="bi bi-exclamation-circle"></i
              ></span>
              Vital Task
            </a>
            <a href="#" class="nav-link">
              <span class="nav-icon"><i class="bi bi-check2-square"></i></span>
              My Task
            </a>
            <a href="#" class="nav-link">
              <span class="nav-icon"><i class="bi bi-ui-checks"></i></span>
              Task Categories
            </a>
            <a href="#" class="nav-link">
              <span class="nav-icon"><i class="bi bi-gear"></i></span>
              Settings
            </a>
            <a href="#" class="nav-link">
              <span class="nav-icon"
                ><i class="bi bi-question-circle"></i
              ></span>
              Help
            </a>
          </nav>

          <div class="sidebar-footer">
            <button class="logout-btn" id="logout-button">
              <i class="bi bi-box-arrow-right"></i>
              Logout
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Dashboard Content -->
      <main class="main-content">
        <section class="welcome-header">
          <h1 class="greeting-text" id="wellcome-back">Welcome back....</h1>

          <div class="team-invite-wrapper">
            <div class="avatar-stack">
              <img
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=60&auto=format&fit=crop&q=80"
                alt="member"
              />
              <img
                src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=60&auto=format&fit=crop&q=80"
                alt="member"
              />
              <img
                src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=60&auto=format&fit=crop&q=80"
                alt="member"
              />
              <img
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=60&auto=format&fit=crop&q=80"
                alt="member"
              />
              <div class="stack-counter">+4</div>
            </div>
            <button class="btn-invite">
              <i class="bi bi-person-plus"></i>
              Invite
            </button>
          </div>
        </section>

        <!-- Button trigger modal -->

        <!-- Modal -->
        <!-- Add Task Modal -->
        <div
          class="modal fade custom-modal"
          id="addTaskModal"
          tabindex="-1"
          aria-labelledby="addTaskModalLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <!-- Modal Header -->
              <div class="modal-header border-0 pb-0">
                <div class="d-flex align-items-center gap-2">
                  <div class="modal-icon-badge">
                    <i class="bi bi-clipboard-plus"></i>
                  </div>
                  <div>
                    <h5 class="modal-title" id="addTaskModalLabel">
                      Add New Task
                    </h5>
                    <p class="modal-subtitle mb-0">
                      Fill in the details to create a task
                    </p>
                  </div>
                </div>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Close"
                ></button>
              </div>

              <!-- Modal Form Body -->
              <form>
                <div class="modal-body py-3">
                  <!-- Task Title -->
                  <div class="mb-3">
                    <label for="taskTitle" class="form-label-custom"
                      >Task Title</label
                    >
                    <input
                      type="text"
                      class="form-control custom-input"
                      id="taskTitle"
                      placeholder="e.g. Landing Page Design"
                      required
                    />
                  </div>

                  <!-- Task Description -->
                  <div class="mb-3">
                    <label for="taskDesc" class="form-label-custom"
                      >Description</label
                    >
                    <textarea
                      class="form-control custom-input"
                      id="taskDesc"
                      rows="3"
                      placeholder="Brief details about the task..."
                      required
                    ></textarea>
                  </div>

                  <!-- Priority & Status Row -->
                  <div class="row g-2 mb-3">
                    <div class="col-6">
                      <label for="taskPriority" class="form-label-custom"
                        >Priority</label
                      >
                      <select
                        class="form-select custom-input"
                        id="taskPriority"
                      >
                        <option value="Moderate" selected>Moderate</option>
                        <option value="Extreme">Extreme</option>
                        <option value="Low">Low</option>
                      </select>
                    </div>
                    <div class="col-6">
                      <label for="taskStatus" class="form-label-custom"
                        >Status</label
                      >
                      <select class="form-select custom-input" id="taskStatus">
                        <option value="Not Started" selected>
                          Not Started
                        </option>
                        <option value="In Progress">In Progress</option>
                        <option value="Completed">Completed</option>
                      </select>
                    </div>
                  </div>

                  <!-- Optional Image URL -->
                  <div class="mb-2">
                    <label for="taskImage" class="form-label-custom"
                      >Thumbnail Image URL (Optional)</label
                    >
                    <input
                      type="url"
                      class="form-control custom-input"
                      id="taskImage"
                      placeholder="https://example.com/image.jpg"
                    />
                  </div>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer border-0 pt-0">
                  <button
                    type="button"
                    class="btn btn-secondary-custom"
                    data-bs-dismiss="modal"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    class="btn btn-primary-coral"
                    id="createTaskBtn"
                  >
                    Create Task
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
        <!-- Dashboard Task Grid -->
        <div class="dashboard-board">
          <!-- Left Column: To-Do List -->
          <div class="todo-column">
            <div class="column-header">
              <div class="title-with-icon">
                <i class="bi bi-clipboard text-coral"></i>
                <span class="header-label">To-Do</span>
              </div>
              <button
                class="btn-add-task"
                id="createTaskBtn"
                type="button"
                class="btn-add-task-main"
                data-bs-toggle="modal"
                data-bs-target="#addTaskModal"
                aria-label="Add Task"
              >
                <i class="bi bi-plus-lg"></i> Add task
              </button>
            </div>
            <p class="date-filter">
              20 June <span class="bullet">•</span> Today
            </p>

            <div class="task-list" id="dashboard-article-list">
            </div>
          </div>

          <!-- Right Column: Status & Completed Tasks -->
          <div class="widgets-column">
            <section class="widget-panel">
              <div class="panel-header">
                <i class="bi bi-clipboard2-data text-coral"></i>
                <span class="panel-title">Task Status</span>
              </div>

              <div class="charts-row" id="taskStatusDic">

              </div>
            </section>

            <section class="widget-panel">
              <div class="panel-header">
                <i class="bi bi-check2-circle text-coral"></i>
                <span class="panel-title">Completed Task</span>
              </div>

              <div class="completed-task-list" id="completedTask">

              </div>
            </section>
          </div>
        </div>
      </main>
    </div>

    <!-- Bootstrap 5.3 JS Bundle (Offcanvas toggle aur close handles automatically) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/dashboard.js" type="module"></script>
    <script type="module" src="../firebase.js"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../js/navbar.js"></script>
    <script type="module" src="../authState.js"></script>
  </body>
</html>
