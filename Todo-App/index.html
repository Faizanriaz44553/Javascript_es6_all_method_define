<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Todo-App</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-container">
      <div class="signup-card">
        
        <!-- Left Side: Illustration -->
        <div class="illustration-wrapper">
          <img src="/assets/R 2.png" alt="Sign up illustration" class="illustration-img" />
        </div>

        <!-- Right Side: Form -->
        <div class="form-wrapper">
          <h1 class="form-title">Sign Up</h1>

          <form class="signup-form">
            
            <!-- First Name -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                  <circle cx="19" cy="8" r="2"/>
                </svg>
              </span>
              <input
                type="text"
                name="firstName"
                class="form-control"
                placeholder="Enter First Name"
                id="f-name"
                required
              />
            </div>

            <!-- Last Name -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                  <circle cx="19" cy="8" r="2"/>
                </svg>
              </span>
              <input
                type="text"
                name="lastName"
                class="form-control"
                placeholder="Enter Last Name"
                id="l-name"
                required
              />
            </div>

            <!-- Username -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"/>
                </svg>
              </span>
              <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter Username"
                id="u-name"
                required
              />
            </div>

            <!-- Email -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
              </span>
              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Enter Email"
                id="email"
                required
              />
            </div>

            <!-- Password -->
            <div class="input-group">
              <span class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
              </span>
              <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                id="password"
                required
              />
            </div>

            <!-- Checkbox -->
            <div class="checkbox-group">
              <input type="checkbox" id="terms" name="terms" required />
              <label for="terms">I agree to all terms</label>
            </div>

            <!-- Submit Button -->
            <button type="button" class="btn-register" id="submit">Register</button>

            <!-- Sign In Footer -->
            <p class="signin-text">
              Already have an account? <a href="./pages/login.html" class="signin-link">Sign In</a>
            </p>

          </form>
        </div>

      </div>
    </main>
   <script src="./firebase.js" type="module"></script>
    <script src="./app.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
